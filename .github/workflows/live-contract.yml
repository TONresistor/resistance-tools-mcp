name: Live MCP contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:live
